<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroVital · Pruebas</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/base.css">
<style>
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  #sum{font-family:var(--f-display);font-size:1.4rem;font-weight:700;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
  #sum[data-ok="true"]{color:var(--ok);border-color:var(--ok)}
  #sum[data-ok="false"]{color:var(--bad);border-color:var(--bad)}
  h3{margin-top:12px;color:var(--accent)}
  .t{background:var(--panel);border-left:3px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.92rem}
  .t.ok{border-left-color:var(--ok)}
  .t.bad{border-left-color:var(--bad);color:var(--bad)}
  .t small{color:var(--muted)}
  a{color:var(--accent)}
</style>
<script type="module" src="tests.js"></script>
</head>
<body>
<div class="wrap">
  <h1>AstroVital · Pruebas automáticas</h1>
  <p class="note" style="color:var(--muted)">Prueban los modelos reales (rangos, evaluador, radiación, base de datos, tripulación, misiones, reporte y enlace) con una base de datos en memoria, sin tocar los datos guardados. <a href="../index.html">Volver a la App Nave</a></p>
  <div id="sum" data-ok="">Ejecutando pruebas…</div>
  <div id="out"></div>
</div>
</body>
</html>
